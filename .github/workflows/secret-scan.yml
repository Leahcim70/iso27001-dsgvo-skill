name: Secret scanning
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install and verify pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          version=8.24.3
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl --fail --location --retry 3 -o gitleaks.tar.gz "${base}/gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --location --retry 3 -o checksums.txt "${base}/gitleaks_${version}_checksums.txt"
          grep " gitleaks_${version}_linux_x64.tar.gz$" checksums.txt | sed "s# gitleaks_${version}_linux_x64.tar.gz# gitleaks.tar.gz#" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
          rm -f gitleaks.tar.gz checksums.txt
      - name: Scan complete Git history
        shell: bash
        run: |
          gitleaks detect --source . --log-opts="--all" --redact --exit-code 1 --log-level error
